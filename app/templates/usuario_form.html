{% extends "base.html" %}

{% block title %}Novo funcionário{% endblock %}
{% block trilha %}PADOC / Funcionários / Novo{% endblock %}
{% block titulo_pagina %}Cadastrar funcionário{% endblock %}

{% block content %}
<form method="post">
    <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="campo">
        <label for="cargo">Cargo</label>
        <select id="cargo" name="cargo">
            <option value="Atendente">Atendente</option>
            <option value="Administrador">Administrador</option>
        </select>
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
    </div>

    <div class="barra-acoes">
        <button type="submit" class="botao botao-primario">Salvar</button>
        <a href="{{ url_for('usuarios.listar_usuarios') }}" class="botao botao-secundario">Cancelar</a>
    </div>
</form>
{% endblock %}
