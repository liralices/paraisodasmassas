{% extends "base.html" %}
{% block title %}Novo insumo{% endblock %}
{% block trilha %}Estoque{% endblock %}
{% block titulo_pagina %}Novo insumo{% endblock %}

{% block content %}
<form method="post" novalidate>
    <div class="campo">
        <label for="nome">Nome do insumo</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <div class="campo">
        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade">
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="l">litros</option>
            <option value="un">unidades</option>
        </select>
    </div>

    <div class="campo">
        <label for="quantidade_atual">Quantidade atual</label>
        <input type="number" id="quantidade_atual" name="quantidade_atual" step="0.01" min="0" required>
    </div>

    <div class="campo">
        <label for="quantidade_minima">Quantidade mínima (alerta)</label>
        <input type="number" id="quantidade_minima" name="quantidade_minima" step="0.01" min="0" required>
    </div>

    <button type="submit" class="botao-primario">Cadastrar</button>
</form>
{% endblock %}
