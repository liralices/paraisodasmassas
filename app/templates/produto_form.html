{% extends "base.html" %}
{% block title %}Novo produto{% endblock %}
{% block trilha %}Cadastros › Produtos{% endblock %}
{% block titulo_pagina %}Novo produto{% endblock %}

{% block content %}
<form method="post" novalidate>
    <div class="campo">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" name="nome" value="{{ produto.nome if produto else 'Pão francês' }}" required>
    </div>

    <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
            {% set categoria_atual = produto.categoria if produto else 'pao' %}
            <option value="pao" {{ 'selected' if categoria_atual == 'pao' else '' }}>Pão</option>
            <option value="doce" {{ 'selected' if categoria_atual == 'doce' else '' }}>Doce</option>
            <option value="salgado" {{ 'selected' if categoria_atual == 'salgado' else '' }}>Salgado</option>
            <option value="bebida" {{ 'selected' if categoria_atual == 'bebida' else '' }}>Bebida</option>
            <option value="outro" {{ 'selected' if categoria_atual == 'outro' else '' }}>Outro</option>
        </select>
    </div>

    <div class="campo">
        <label for="tipo_estoque">Tipo de estoque</label>
        <select id="tipo_estoque" name="tipo_estoque">
            {% set tipo_atual = tipo_estoque or (produto.tipo_estoque if produto else 'producao') %}
            <option value="producao" {{ 'selected' if tipo_atual == 'producao' else '' }}>Produção própria</option>
            <option value="venda_direta" {{ 'selected' if tipo_atual == 'venda_direta' else '' }}>Venda direta</option>
        </select>
    </div>

    <div class="campo">
        <label for="codigo_barras">Código de barras</label>
        <input type="text" id="codigo_barras" name="codigo_barras" value="{{ produto.codigo_barras if produto else '' }}" placeholder="7891234567890" required>
    </div>

    <div class="campo">
        <label for="fornecedor_id">Fornecedor</label>
        <select id="fornecedor_id" name="fornecedor_id">
            <option value="">Sem fornecedor</option>
            {% for fornecedor in fornecedores %}
            <option value="{{ fornecedor.id }}" {{ 'selected' if produto and produto.fornecedor_id == fornecedor.id else '' }}>{{ fornecedor.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="campo">
        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade">
            {% set unidade_atual = produto.unidade if produto else 'un' %}
            <option value="un" {{ 'selected' if unidade_atual == 'un' else '' }}>unidades</option>
            <option value="l" {{ 'selected' if unidade_atual == 'l' else '' }}>litros</option>
            <option value="kg" {{ 'selected' if unidade_atual == 'kg' else '' }}>kg</option>
            <option value="cx" {{ 'selected' if unidade_atual == 'cx' else '' }}>caixas</option>
        </select>
    </div>

    <div class="campo">
        <label for="estoque_atual">Estoque atual</label>
        <input type="number" id="estoque_atual" name="estoque_atual" step="0.01" min="0" value="{{ produto.estoque_atual if produto else 0 }}">
    </div>

    <div class="campo">
        <label for="estoque_minimo">Estoque mínimo</label>
        <input type="number" id="estoque_minimo" name="estoque_minimo" step="0.01" min="0" value="{{ produto.estoque_minimo if produto else 0 }}">
    </div>

    <div class="campo">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" value="{{ produto.preco if produto else '0.00' }}" required>
    </div>

    <button type="submit" class="botao-primario">{% if editando %}Salvar alterações{% else %}Cadastrar{% endif %}</button>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const codigoBarras = document.getElementById('codigo_barras');
        if (!codigoBarras.value || !/^[0-9]{13}$/.test(codigoBarras.value.trim())) {
            const numero = '789' + Array.from({ length: 10 }, () => Math.floor(Math.random() * 10)).join('');
            codigoBarras.value = numero;
        }
    });
</script>
{% endblock %}
