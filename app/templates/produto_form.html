{% extends "base.html" %}
{% block title %}Novo produto{% endblock %}
{% block trilha %}Cadastros › Produtos{% endblock %}
{% block titulo_pagina %}Novo produto{% endblock %}

{% block content %}
<form method="post" novalidate>
    <div class="campo">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
            <option value="pao">Pão</option>
            <option value="doce">Doce</option>
            <option value="salgado">Salgado</option>
            <option value="bebida">Bebida</option>
            <option value="outro">Outro</option>
        </select>
    </div>

    <div class="campo">
        <label for="tipo_estoque">Tipo de estoque</label>
        <select id="tipo_estoque" name="tipo_estoque">
            <option value="producao" {{ 'selected' if tipo_estoque == 'producao' else '' }}>Produção própria</option>
            <option value="venda_direta" {{ 'selected' if tipo_estoque == 'venda_direta' else '' }}>Venda direta</option>
        </select>
    </div>

    <div class="campo">
        <label for="codigo_barras">Código de barras</label>
        <input type="text" id="codigo_barras" name="codigo_barras" placeholder="7891234567890">
    </div>

    <div class="campo">
        <label for="fornecedor_id">Fornecedor</label>
        <select id="fornecedor_id" name="fornecedor_id">
            <option value="">Sem fornecedor</option>
            {% for fornecedor in fornecedores %}
            <option value="{{ fornecedor.id }}">{{ fornecedor.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="campo">
        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade">
            <option value="un">unidades</option>
            <option value="l">litros</option>
            <option value="kg">kg</option>
            <option value="cx">caixas</option>
        </select>
    </div>

    <div class="campo">
        <label for="estoque_atual">Estoque atual</label>
        <input type="number" id="estoque_atual" name="estoque_atual" step="0.01" min="0" value="0">
    </div>

    <div class="campo">
        <label for="estoque_minimo">Estoque mínimo</label>
        <input type="number" id="estoque_minimo" name="estoque_minimo" step="0.01" min="0" value="0">
    </div>

    <div class="campo">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" required>
    </div>

    <button type="submit" class="botao-primario">Cadastrar</button>
</form>
{% endblock %}
