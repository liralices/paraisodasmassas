<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADOC | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="auth-logo">PADOC</span>
                <p>Sistema de Gestão para Padarias</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash" role="status">
                        {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <h1>Entrar no sistema</h1>
            <form method="post">
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="funcionario@padoc.com" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="botao botao-primario auth-button">Entrar</button>
            </form>

            <p class="auth-footer">
                Ainda não tem conta?
                <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>
</html>
